<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>스마트 분실물 등록 키오스크</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="kiosk-container">

    <!-- ============ 홈 화면 ============ -->
    <section id="view-home" class="view-section active">
        <header>
            <h1>💡 스마트 분실물 키오스크</h1>
        </header>
        <div class="home-content">
            <div class="status-badge">
                <p>현재 분실물을 <br><span id="display-count">0</span>개 보관중입니다.</p>
            </div>
            <div class="home-buttons">
                <button class="big-btn btn-register-main" onclick="navTo('register')">📦 분실물 등록하기</button>
                <button class="big-btn btn-find-main" onclick="startFindFlow()">🔍 분실물 찾기</button>
            </div>
        </div>
    </section>

    <!-- ============ 등록 화면 ============ -->
    <section id="view-register" class="view-section">
        <header>
            <button class="btn-back" onclick="navTo('home')">◀</button>
            <h1>💡 스마트 분실물 등록</h1>
            <p>습득한 물건의 정보를 최대한 자세히 입력해 주세요.</p>
        </header>
        <div class="scroll-area">
            <div class="form-group">
                <label>물품명</label>
                <input type="text" id="reg-name" placeholder="예: 파란색 삼선 슬리퍼, 아이폰 13">
            </div>
            <div class="form-group">
                <label>습득 장소</label>
                <div class="picker-block">
                    <div class="picker-row" id="reg-floor-row"></div>
                    <div class="picker-row" id="reg-room-row"></div>
                    <div class="add-inline" id="reg-location-add">
                        <input type="text" id="reg-location-add-input" placeholder="목록에 없는 장소명을 입력하세요">
                        <button type="button" class="btn-side" onclick="confirmAddLocation('reg')">추가</button>
                    </div>
                </div>
            </div>
            <div class="form-group">
                <label>습득 날짜</label>
                <div class="btn-group">
                    <button type="button" id="btn-reg-date-auto" class="active" onclick="setRegDateMode('auto')">현재 날짜 자동 입력</button>
                    <button type="button" id="btn-reg-date-manual" onclick="setRegDateMode('manual')">직접 입력하기</button>
                </div>
                <input type="date" id="reg-date" disabled>
            </div>
            <div class="form-group">
                <label>분실물의 색상이 어떻게 되나요?</label>
                <div class="color-grid" id="reg-color-grid"></div>
            </div>
            <div class="form-group">
                <label>습득 물품의 분류를 선택하세요</label>
                <div class="picker-block">
                    <div class="picker-row" id="reg-category-row"></div>
                    <div class="add-inline" id="reg-category-add">
                        <input type="text" id="reg-category-add-input" placeholder="목록에 없는 카테고리명을 입력하세요">
                        <button type="button" class="btn-side" onclick="confirmAddCategory('reg')">추가</button>
                    </div>
                </div>
            </div>
            <div class="form-group">
                <label>브랜드 / 제조사 (선택)</label>
                <input type="text" id="reg-brand" placeholder="예: 삼성, 나이키, 모나미 (모르면 비워두세요)">
            </div>
            <div class="form-group">
                <label>특이사항 (해당하는 것을 모두 선택, 선택)</label>
                <div class="chip-grid" id="reg-tag-grid"></div>
            </div>
            <div class="form-group">
                <label>기타 사항</label>
                <textarea id="reg-details" placeholder="특징이나 메모를 적어주세요"></textarea>
            </div>
            <div class="form-group">
                <label>물품 사진 (선택)</label>
                <div class="camera-box" id="camera-box">
                    <video id="camera-video" autoplay playsinline style="display:none;"></video>
                    <img id="camera-preview-img" style="display:none;" alt="촬영된 사진">
                    <div id="camera-placeholder" class="camera-placeholder">
                        📷
                        <p>사진이 없습니다</p>
                    </div>
                </div>
                <canvas id="camera-canvas" style="display:none;"></canvas>
                <div class="camera-controls">
                    <button type="button" class="btn-side" id="btn-camera-start" onclick="startCamera()">📷 촬영하기</button>
                    <button type="button" class="btn-side" id="btn-camera-capture" style="display:none;" onclick="capturePhoto()">📸 찰칵</button>
                    <button type="button" class="btn-side" id="btn-camera-retake" style="display:none;" onclick="retakePhoto()">🔄 다시 찍기</button>
                    <input type="file" id="camera-file-fallback" accept="image/*" capture="environment" style="display:none;" onchange="handleFileFallback(event)">
                </div>
            </div>
        </div>
        <button class="submit-btn" onclick="submitRegister()">분실물 등록하기</button>
    </section>

    <!-- ============ 찾기 (아키네이터식 스무고개) 화면 ============ -->
    <section id="view-find" class="view-section">
        <header>
            <button class="btn-back" onclick="navTo('home')">◀</button>
            <h1>🔍 스마트 분실물 찾기</h1>
            <p>질문에 답하면서 물건을 찾아드릴게요.<br>모르는 건 "모르겠어요"를 눌러도 괜찮아요.</p>
        </header>
        <div class="scroll-area" id="find-body"></div>
    </section>

    <!-- ============ 결과 모달 ============ -->
    <div id="modalOverlay" class="modal-overlay">
        <div class="modal-card">
            <div id="modalIcon" class="modal-icon">📦</div>
            <div id="modalContent" class="modal-title"></div>
            <button class="btn-close" id="modalCloseBtn" onclick="closeModal()">닫기</button>
        </div>
    </div>

</div>

<script src="script.js"></script>
</body>
</html>
